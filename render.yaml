services:
  - type: web
    name: delta-wallet-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: BMONI_MODE
        value: "live"
      - key: BMONI_API_KEY
        sync: false
      - key: BMONI_BASE_URL
        value: "https://embedded.bmoni.com"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_WALLET_OWNER_PRIVATE_KEY
        sync: false
